name: Diagnose FOYS public API

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-foys.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect calendar-related widget code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,urllib.request
          url='https://competition-widget.foys.tech/competition-widget.js'
          js=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read().decode('utf-8','ignore')
          low=js.lower()
          for needle in ['calendar','ical','ics','webcal','agenda','subscribe','subscription','sendcalendar','calendarlink']:
              print('\n==========',needle,'==========')
              pos=0; shown=0
              while shown<30:
                  i=low.find(needle,pos)
                  if i<0: break
                  print(re.sub(r'\s+',' ',js[max(0,i-1200):min(len(js),i+2600)]))
                  pos=i+len(needle);shown+=1
          print('\nROUTES')
          routes=sorted(set(re.findall(r'(["`])(/[^"`\\\n]{1,180})\1',js)))
          for _,route in routes:
              if any(x in route.lower() for x in ['calendar','ical','ics','subscription']):print(route)
          PY
