name: Update calendar subscriptions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-calendars.yml"
      - "scripts/generate_calendars.py"
      - "data/tasks.json"
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

concurrency:
  group: calendar-subscriptions
  cancel-in-progress: true

jobs:
  build-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ICS subscriptions
        run: python scripts/generate_calendars.py

      - name: Commit changed calendar feeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cal
          if git diff --cached --quiet; then
            echo "Calendar feeds are already current."
            exit 0
          fi
          git commit -m "Update calendar subscriptions"
          git push
