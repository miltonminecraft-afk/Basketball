name: Fix Club realtime once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-club-realtime-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Club realtime race and cache versions
        shell: python
        run: |
          from pathlib import Path

          club = Path('club.js')
          s = club.read_text(encoding='utf-8')

          old = "if(member?.active){await loadBaseData();setupRealtime();}"
          new = "if(member?.active){await loadBaseData();try{setupRealtime();}catch(realtimeError){console.warn('Realtime kon niet starten; Club blijft bruikbaar.',realtimeError);}}"
          if old not in s:
              raise SystemExit('refreshMember target not found')
          s = s.replace(old, new, 1)

          old = "function setupRealtime(){if(!supabase||!member)return;const channel=supabase.channel(`club-${member.id}`).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:`recipient_member_id=eq.${member.id}`},reloadDynamic).on('postgres_changes',{event:'*',schema:'public',table:'task_swap_requests'},reloadDynamic).on('postgres_changes',{event:'*',schema:'public',table:'task_assignments'},reloadDynamic).on('postgres_changes',{event:'*',schema:'public',table:'training_sessions'},reloadDynamic).subscribe();realtimeChannels=[channel]}"
          new = "function setupRealtime(){if(!supabase||!member)return;const topic=`club-${member.id}-${Date.now()}-${Math.random().toString(36).slice(2)}`;const channel=supabase.channel(topic);channel.on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:`recipient_member_id=eq.${member.id}`},reloadDynamic);channel.on('postgres_changes',{event:'*',schema:'public',table:'task_swap_requests'},reloadDynamic);channel.on('postgres_changes',{event:'*',schema:'public',table:'task_assignments'},reloadDynamic);channel.on('postgres_changes',{event:'*',schema:'public',table:'training_sessions'},reloadDynamic);realtimeChannels=[channel];channel.subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Realtime status:',status);});}"
          if old not in s:
              raise SystemExit('setupRealtime target not found')
          s = s.replace(old, new, 1)
          club.write_text(s, encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          if 'club.js?v=1' not in s:
              raise SystemExit('index club version target not found')
          index.write_text(s.replace('club.js?v=1', 'club.js?v=2'), encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace("basketball-agenda-v8", "basketball-agenda-v9")
          s = s.replace("club.js?v=1", "club.js?v=2")
          sw.write_text(s, encoding='utf-8')

          Path('.github/workflows/fix-club-realtime-once.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add club.js index.html sw.js .github/workflows/fix-club-realtime-once.yml
          git commit -m "Fix Club realtime subscription race"
          git push origin HEAD:main